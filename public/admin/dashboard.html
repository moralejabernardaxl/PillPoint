<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard — PillPoint</title>
<link rel="icon" type="image/svg+xml" href="/img/logo-mark.svg" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<script src="/js/api.js"></script>
<script src="/js/layout.js"></script>
<script>
(async function () {
  const user = await guardPage(['admin'], 'Admin Dashboard', 'System-wide overview');
  if (!user) return;
  const content = document.getElementById('page-content');
  content.innerHTML = `<div class="empty-state">Loading...</div>`;
  try {
    const data = await Api.get('/api/admin/dashboard');
    content.innerHTML = `
      <div class="grid grid-4">
        <div class="card stat-card"><div class="stat-icon">&#127974;</div><div class="stat-label">Pharmacies</div><div class="stat-value">${data.totals.pharmacies}</div></div>
        <div class="card stat-card"><div class="stat-icon">&#9989;</div><div class="stat-label">Verified Pharmacies</div><div class="stat-value">${data.totals.verifiedPharmacies}</div></div>
        <div class="card stat-card"><div class="stat-icon">&#128100;</div><div class="stat-label">Customers</div><div class="stat-value">${data.totals.customers}</div></div>
        <div class="card stat-card"><div class="stat-icon">&#128203;</div><div class="stat-label">Total Reservations</div><div class="stat-value">${data.totals.reservations}</div></div>
      </div>
      <div class="grid grid-4 mt-24">
        <div class="card stat-card"><div class="stat-icon">&#9203;</div><div class="stat-label">Pending Reservations</div><div class="stat-value">${data.stats.pendingReservations}</div></div>
        <div class="card stat-card"><div class="stat-icon">&#128683;</div><div class="stat-label">Unverified Pharmacies</div><div class="stat-value">${data.stats.unverifiedPharmacies}</div></div>
        <div class="card stat-card"><div class="stat-icon">&#9888;</div><div class="stat-label">Low Stock Alerts</div><div class="stat-value">${data.stats.lowStockAlerts}</div></div>
        <div class="card stat-card"><div class="stat-icon">&#128176;</div><div class="stat-label">System Inventory Value</div><div class="stat-value">${money(data.stats.totalInventoryValue)}</div></div>
      </div>

      <div class="grid mt-24" style="grid-template-columns: 1fr 1.3fr; gap:18px;">
        <div class="card">
          <div class="card-title">Reservations by Status</div>
          ${data.reservationsByStatus.length
            ? pieChart3D(data.reservationsByStatus.map(s => ({ label: s.status, value: s.count })))
            : `<div class="empty-state" style="padding:24px;"><p class="text-sm">No reservations yet.</p></div>`}
        </div>
        <div class="card">
          <div class="card-title">Top Pharmacies by Reservations</div>
          ${data.topPharmacies.length ? `
            <table>
              <thead><tr><th>Pharmacy</th><th>Reservations</th></tr></thead>
              <tbody>${data.topPharmacies.map(p => `<tr><td>${escapeHtml(p.name)}</td><td>${p.reservation_count}</td></tr>`).join('')}</tbody>
            </table>
          ` : `<div class="empty-state" style="padding:24px;"><p class="text-sm">No data yet.</p></div>`}
        </div>
      </div>

      <div class="text-sm muted mt-16">New customers this week: <strong>${data.stats.newCustomersThisWeek}</strong></div>

      ${data.shortageCount > 0 ? `<div class="alert alert-error mt-24">${data.shortageCount} medicine${data.shortageCount > 1 ? 's are' : ' is'} currently out of stock system-wide. <a href="/admin/shortages.html" style="font-weight:700;">View shortages &rarr;</a></div>` : ''}
      <div class="flex gap-12 mt-24">
        <a href="/admin/pharmacies.html" class="btn btn-primary">Manage Pharmacies</a>
        <a href="/admin/shortages.html" class="btn btn-outline">View Shortages</a>
      </div>
    `;
  } catch (err) {
    content.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
  }
})();
</script>
</body>
</html>
